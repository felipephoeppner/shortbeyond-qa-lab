name: Testes de API
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run env:up
      - name: Aguardar API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3433/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm run test:api
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 7
      - name: Logs e encerramento
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down
